plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id 'kotlin-kapt' //پلاگین kapt برای moshi

}

android {
    namespace 'com.tinixmusic.tinixmusic2'
    compileSdk 33
    buildToolsVersion "33.0.2"


    defaultConfig {
        applicationId "com.tinixmusic.tinixmusic2"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    // Room
    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    kapt 'androidx.room:room-compiler:2.5.2'

// WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.8.1'


    implementation "androidx.navigation:navigation-compose:2.5.3" //برای نویگیشن compose اضافه شد

    // Retrofit و Moshi
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.13.0'
    implementation 'junit:junit:4.12'
    implementation 'junit:junit:4.12'
    implementation 'org.testng:testng:6.9.6'
    kapt 'com.squareup.moshi:moshi-kotlin-codegen:1.13.0'

// OkHttp Logging (برای دیدن درخواست‌ها توی Logcat)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'

// Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

// ViewModel Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.5.1'

// Coil (برای نمایش تصاویر از اینترنت)
    implementation 'io.coil-kt:coil-compose:2.4.0'

    //Media3 (ExoPlayer)
    implementation 'androidx.media3:media3-exoplayer:1.1.1'
    implementation 'androidx.media3:media3-common:1.1.1'
    implementation 'androidx.media3:media3-session:1.1.1'
    // جدا اضافه شده
    //implementation 'androidx.media3:media3-ui:1.1.1'


    //آیکون های پایه جدا اضافه شد
    implementation 'androidx.compose.material:material-icons-core'

    //آیکون های اضافی شامل Pause , PlayArrow جدا اضافه شد
    implementation 'androidx.compose.material:material-icons-extended'

    // کتابخانه دیتا استور
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    //implementation 'androidx.datastore:datastore-preferences-core:1.1.1'

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.0')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.5.1'
    implementation platform('androidx.compose:compose-bom:2022.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2022.10.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'


}